<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onbordo — Pricing (Skeleton, Aşama 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================================================
     NAV — ana sayfayla birebir aynı component.
     Not: mega menü bu iskelette henüz yok (kapsam dışı — zaten
     "dokunulmuyor" denen, üstün olduğu için mevcut haliyle korunacak
     bir parça, Aşama 3'te gerçek içerikle birlikte eklenecek).
     ============================================================ -->
<nav class="nav">
  <div class="container">
    <div class="nav__left">
      <a href="/" class="nav__logo"><img src="logo.png" alt="Onbordo" class="nav__logo-icon"><span class="nav__logo-text">onbordo</span></a>
      <div class="nav__links">
        <a href="/pricing" class="nav__link">Pricing</a>
      </div>
    </div>
    <div class="nav__actions">
      <a href="#" class="btn-ph primary">Get Started</a>
    </div>
  </div>
</nav>

<main>

  <!-- ============================================================
       ALT SAYFA HERO — Dify pricing'in SADECE üst kısmı.
       Plan kartları / toggle alınmadı.
       Product/Solutions/Resources/Pricing'in DÖRDÜ DE bu şablonu
       kullanır — değişen sadece eyebrow/headline/subtext metni.
       ============================================================ -->
  <section class="subpage-hero section-anchor">
    <span class="tag">Alt sayfa hero (ortak şablon)</span>
    <div class="container">
      <div class="subpage-hero__eyebrow"></div>
      <div class="subpage-hero__headline"></div>
      <div class="subpage-hero__subtext"></div>
      <div class="subpage-hero__cta"></div>
    </div>
  </section>

  <!-- ============================================================
       İÇERİK ALANI — kasıtlı boş. Bu sayfaya özel içerik
       (Product/Solutions/Resources/Pricing arasında farklılaşan
       tek yer burası) Aşama 3'te doldurulacak.
       ============================================================ -->
  <section class="subpage-content section-anchor">
    <span class="tag">İçerik alanı — sayfaya özel, sonra doldurulacak</span>
    <div class="container">
      <div class="subpage-content__placeholder">
        Pricing sayfasına özel içerik buraya gelecek
      </div>
    </div>
  </section>

</main>

<!-- ============================================================
     FOOTER — ana sayfayla birebir aynı component.
     ============================================================ -->
<footer class="footer section-anchor">
  <span class="tag">Footer (ana sayfayla paylaşılan)</span>
  <div class="container">
    <div class="footer__grid">
      <div>
        <div class="footer__brand"><img src="logo.png" alt="Onbordo" class="footer__brand-icon"><span class="footer__brand-text">onbordo</span></div>
      </div>
      <div>
        <div class="footer__col-title"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
      </div>
      <div>
        <div class="footer__col-title"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
      </div>
      <div>
        <div class="footer__col-title"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
      </div>
      <div>
        <div class="footer__col-title"></div>
        <div class="footer__link"></div>
        <div class="footer__link"></div>
      </div>
    </div>
    <div class="footer__bottom">
      <div class="footer__copyright"></div>
      <div class="footer__social">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
